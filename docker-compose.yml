services:
  # 1. FastAPI Backend API & Correlation Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_FILE=/app/sentinelshield.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./reports:/app/reports
      - ./sentinelshield.db:/app/sentinelshield.db
    networks:
      - sentinel-net

  # 2. React / Nginx Frontend SOC Console
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinelshield-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sentinel-net

  # 3. Isolated World Monitor Sandbox Target (Digital Twin)
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: sentinelshield-sandbox
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
